      把 Phase 1 的 mock MeetingCapture 升级到真实音频 + 转录 + 落盘完整管线.
      12-18h 工作量. PRD 5 个 must-have (M1+M2+M3+M5+M6+M7), M4 已 Phase 1 做完, M8 Phase 3 跳过.

      ## 项目背景
      DailyFlow = 本地优先任务 + 笔记 + AI 桌面 app (Tauri 2 + React 19 + Vite + Express + Tailwind 4).
      v1.0.3 on main, **当前 main 在 `e04343f`**. Phase 1 已经在 main 上:
      - `server/routes/meetings.ts` (278 行) — `/api/meetings/transcribe` (mock) + `/api/meetings/summarize` (LLM 代理)
      - `src/components/MeetingCapture.tsx` (488 行) — 4 步 modal, 现状是 mock transcript 粘贴
      - `src/components/ContextPicker.tsx` (552 行) — 第 5 个 tab "会议"
      - `src/api/client.ts:832` — `meetingsApi` (transcribe + summarize)
      PRD: `docs/review/granola-fusion-spec.md` (270 行)
      Plan: `docs/review/implementation-plan-2026-07-12.md` (40 行)

      ## Phase 2 范围 (M1+M2+M3+M5+M6+M7)
      ### M1. ⌘K 触发 MeetingCapture (已有 AI Chat 工具栏"会议"按钮, 加 ⌘⇧R 全局快捷键)
      - 在 `src/App.tsx` 全局 keydown listener 加 ⌘⇧R 触发 MeetingCapture modal
      - 注意: ⌘⇧R 在浏览器/系统里通常是 reload, 拦下来 + preventDefault, 提示用户这是 dailyflow 的会议快捷键
      - macOS 系统级快捷键用 Tauri globalShortcut plugin, **如果太复杂, 降级到 app 内 window keydown**
      - ⌘K palette 加 "Record Meeting" 入口 (现有 ⌘K 在 `src/components/CommandPalette.tsx` 之类, 你 grep 找)

      ### M2. 本地音频录制 (Tauri 2, 但不碰 src-tauri/)
      - 用 Web 标准 `navigator.mediaDevices.getUserMedia({ audio: true })` 拿麦克风
      - 用 `MediaRecorder` API 录到 Blob
      - blob → base64 → POST `/api/meetings/transcribe` (后端写文件 + 转录)
      - **不要碰 src-tauri/** (PRD 风险 2 的 fallback: 不用 native, 用 web API)
      - 麦克风权限: macOS 首次需要授权, 用 Tauri permission 系统 (或者 web permission prompt)
      - 系统音频 (对方说话) 留 v1.1, 不在 Phase 2 范围

      ### M3. 本地转录 (whisper.cpp OR 云端 Whisper API)
      - PRD §7.2: 优先本地 whisper.cpp, **fallback 云端 Whisper API 走 `/api/meetings/transcribe` 代理**
      - v1.0.4 务实选择: **直接走云端 Whisper API** (跟 PRD §3.4 OpenAI-compatible 模式一致, 复用 15+ provider 配置), whisper.cpp 留 v1.1
      - 改 `server/routes/meetings.ts` 的 `POST /api/meetings/transcribe`: 接 base64 audio, 转发到 Whisper API (OpenAI-compatible), 返回 segments JSON
      - 处理 1h 音频 (~ 60MB WAV base64 ~ 80MB), 异步处理, 返回 jobId, 客户端轮询 status
      - **不引入新依赖**: 用现有 `fetch` + `FormData`, 走 server 端 OpenAI-compatible API
      - 转录失败保留 raw audio, 提示用户重试 (PRD §3.4)

      ### M5. Action Items → Tasks 自动落盘
      - `MeetingCapture.tsx` 整理出 meeting_note 后, 后端 `/api/meetings/extract-actions` (新 endpoint) 抽 action items JSON
      - 复用 PRD §3.1 第 5 步 prompt: "从下面会议纪要里提取 action items, 返回 JSON: [{title, owner, due, project, priority}]"
      - 客户端拿到 action items, 弹 "Review N Action Items" 卡片 (PRD §7.3 风险 3 缓解), 用户确认才落盘
      - 确认后调 `tasksApi.create` 每个 action item, source_date = 今天, 带 `#meeting-link:{note-id}` tag

      ### M6. meeting_note 注入 AI Chat 上下文
      - `ContextPicker.tsx` 的 "会议" tab 改: 默认 checked 包含最近 7 天 `type === 'meeting_note'` 的笔记
      - "最近 7 天" 用现有 `notes` prop 过滤, 按 `date` 字段
      - 顶部加 "Auto-include: 7 days" toggle, 用户可关

      ### M7. ⌘K 跨会议搜索
      - 现有 ⌘K palette (在 `src/components/CommandPalette.tsx` 或类似) 加 meeting_note body 搜索
      - 复用 Notes search 逻辑 (`src/components/Notes.tsx:232-238`), 扩展到 `type === 'meeting_note'`
      - 结果卡: 日期 + 标题 + 1 段摘要 + 点开进 Notes

      ## 硬约束
      1. **不要碰 docs/UX_REDESIGN.md, docs/ROADMAP.md, docs/PRODUCT.md** (那是设计稿)
      2. **不要碰 src-tauri/** (Phase 2 也不破例, 用 Web API)
      3. **不要碰 .harness/, .mavis/** (agent infra)
      4. **不要 force push / 不要 push** (Frank 自己管理)
      5. **不要改版本号** (Frank 自己管理)
      6. **不要 cleanup 死代码** (留 R2)
      7. **不要 cleanup App.tsx** (留 R2)
      8. **不要重写 Phase 1 的 meeting_note 模板** (M4 已完)
      9. **不要做 speaker diarization** (PRD §5 non-goal)
      10. **不要做实时字幕** (PRD §5 non-goal)
      11. **不要做日历双向同步** (PRD §5 non-goal)
      12. **不要做云端 audio 同步** (PRD §5 non-goal, 本地 90 天后清理)
      13. **不要做 Phase 3 (MCP Connector)** (PRD §6.3, 不在 v1.0.4)
      14. **不要新加 AI provider** (复用现有 15+ provider 配置)
      15. **不要写 unit test** (ship first, Frank 偏好)
      16. **不要写新 README / 改 README**

      ## 工作流
      1. `git status` clean, `git log --oneline -5` 确认起点
      2. 读 PRD (`docs/review/granola-fusion-spec.md`) 完整一遍
      3. 读现有 Phase 1 代码 (`server/routes/meetings.ts` / `MeetingCapture.tsx` / `ContextPicker.tsx` / `src/api/client.ts:meetingsApi`)
      4. 实施 M1+M2+M3+M5+M6+M7 (按 PRD §6.2 Phase 2 范围)
      5. 跑 `npm run lint` + `npm run build` 必须 PASS
      6. **手动 smoke**: 启 `npm run dev:all` (后台, 30s 后杀), 用 `curl` 测 `/api/meetings/summarize` 走通, `/api/meetings/transcribe` 走 mock fallback (因为真音频需要浏览器)
      7. `git add -A && git commit -m "<中文 commit message>"` (e.g. `feat(granola): Phase 2 真实音频 + 转录 + 落盘 + AI Chat 注入`)
      8. **不要 push**

