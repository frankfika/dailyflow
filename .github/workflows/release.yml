name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            os: macos-13
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app and upload to release
        uses: tauri-apps/tauri-action@v0
        id: tauri-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'DailyFlow ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: |
            ## Downloads

            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon) | `DailyFlow_*_aarch64.dmg` |
            | macOS (Intel) | `DailyFlow_*_x64.dmg` |
            | Windows | `DailyFlow_*_x64-setup.exe` / `DailyFlow_*_x64_en-US.msi` |
            | Linux | `DailyFlow_*_amd64.AppImage` / `DailyFlow_*_amd64.deb` |

            ### 🍎 macOS Note

            This build is not notarized. If you see **"DailyFlow is damaged"**, run:

            ```bash
            sudo xattr -rd com.apple.quarantine /Applications/DailyFlow.app
            ```

            Then right-click the app and choose **Open** to bypass Gatekeeper.

            See commits for full changelog.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.platform.args }}

      - name: Debug signature files
        if: always()
        shell: bash
        run: |
          echo "=== Searching for .sig files ==="
          find src-tauri/target -name "*.sig" -type f 2>/dev/null || echo "find failed"
          echo "=== Bundle directory contents ==="
          find src-tauri/target -type d -name "bundle" 2>/dev/null | while read d; do
            echo "Bundle dir: $d"
            ls -la "$d" || true
          done
