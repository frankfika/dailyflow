name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.2.1)"
        required: true
        type: string
      build_installers:
        description: "Rebuild installers before publishing updater metadata"
        required: true
        default: true
        type: boolean

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Prepare release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build ${{ matrix.platform.name }}
    needs: release-please
    if: >-
      ${{
        always() &&
        ((github.event_name == 'workflow_dispatch' && inputs.build_installers) ||
         needs.release-please.outputs.release_created == 'true')
      }}
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macOS Apple Silicon
            os: macos-14
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app and upload to release
        uses: tauri-apps/tauri-action@v1
        id: tauri-build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.release-please.outputs.tag_name || inputs.tag || github.ref_name }}
          releaseName: "DailyFlow ${{ needs.release-please.outputs.tag_name || inputs.tag || github.ref_name }}"
          releaseBody: |
            ## Downloads

            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon) | `DailyFlow_*_aarch64.dmg` |
            | macOS (Intel) | `DailyFlow_*_x64.dmg` |
            | Windows | `DailyFlow_*_x64-setup.exe` / `DailyFlow_*_x64_en-US.msi` |
            | Linux | `DailyFlow_*_amd64.AppImage` / `DailyFlow_*_amd64.deb` |

            ### 🍎 macOS Note

            This build is not notarized. If you see **"DailyFlow is damaged"**, run:

            ```bash
            sudo xattr -rd com.apple.quarantine /Applications/DailyFlow.app
            ```

            Then right-click the app and choose **Open** to bypass Gatekeeper.

            See commits for full changelog.
          releaseDraft: false
          prerelease: false
          # Matrix jobs upload signed updater archives, but latest.json is
          # generated once after every platform finishes to avoid lost updates.
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          args: ${{ matrix.platform.args }}

      - name: Debug signature files
        if: always()
        shell: bash
        run: |
          echo "=== Searching for .sig files ==="
          find src-tauri/target -name "*.sig" -type f 2>/dev/null || echo "find failed"
          echo "=== Bundle directory contents ==="
          find src-tauri/target -type d -name "bundle" 2>/dev/null | while read d; do
            echo "Bundle dir: $d"
            ls -la "$d" || true
          done

  verify-release:
    name: Verify release assets and updater metadata
    needs: [release-please, build]
    if: >-
      ${{
        always() &&
        ((github.event_name == 'workflow_dispatch' &&
          (inputs.build_installers == false || needs.build.result == 'success')) ||
         (needs.release-please.outputs.release_created == 'true' &&
          needs.build.result == 'success'))
      }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Validate installers, signatures and latest.json
        shell: bash
        run: |
          release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets)"

          check_asset() {
            local pattern="$1"
            local minimum_size="$2"
            local label="$3"
            local size
            size="$(jq -r --arg pattern "$pattern" '[.assets[] | select(.name | test($pattern)) | .size] | max // 0' <<<"$release_json")"
            if (( size < minimum_size )); then
              echo "Missing or unexpectedly small release asset: $label ($size bytes)" >&2
              exit 1
            fi
          }

          check_asset 'aarch64\.dmg$' 20000000 'macOS Apple Silicon DMG'
          check_asset 'x64\.dmg$' 20000000 'macOS Intel DMG'
          check_asset 'x64-setup\.exe$' 20000000 'Windows NSIS installer'
          check_asset 'x64_en-US\.msi$' 20000000 'Windows MSI installer'
          check_asset 'amd64\.AppImage$' 80000000 'Linux AppImage'
          check_asset 'amd64\.deb$' 30000000 'Linux DEB package'
          check_asset 'x86_64\.rpm$' 30000000 'Linux RPM package'

          signature_count="$(jq '[.assets[] | select(.name | endswith(".sig"))] | length' <<<"$release_json")"
          if (( signature_count < 4 )); then
            echo "Expected updater signatures for all platforms, found $signature_count" >&2
            exit 1
          fi

          node scripts/generate-updater-manifest.mjs \
            "$GITHUB_REPOSITORY" \
            "$RELEASE_TAG" \
            "$RUNNER_TEMP/latest.json"

          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/latest.json" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          curl --fail --location --retry 5 --retry-all-errors \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/latest.json" \
            --output "$RUNNER_TEMP/published-latest.json"

          jq -e --arg version "${RELEASE_TAG#v}" '
            .version == $version and
            (.platforms["darwin-aarch64"].signature | length > 20) and
            (.platforms["darwin-aarch64"].url | startswith("https://")) and
            (.platforms["darwin-x86_64"].signature | length > 20) and
            (.platforms["darwin-x86_64"].url | startswith("https://")) and
            (.platforms["windows-x86_64"].signature | length > 20) and
            (.platforms["windows-x86_64"].url | startswith("https://")) and
            (.platforms["linux-x86_64"].signature | length > 20) and
            (.platforms["linux-x86_64"].url | startswith("https://"))
          ' "$RUNNER_TEMP/published-latest.json"

  finalize-release-notes:
    name: Finalize release notes
    needs: [release-please, build, verify-release]
    if: >-
      ${{
        always() &&
        needs.verify-release.result == 'success' &&
        ((github.event_name == 'workflow_dispatch' &&
          (inputs.build_installers == false || needs.build.result == 'success')) ||
         (needs.release-please.outputs.release_created == 'true' &&
          needs.build.result == 'success'))
      }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Add downloads and macOS installation guidance
        shell: bash
        run: |
          existing_body="$(gh release view "$RELEASE_TAG" --json body --jq .body)"

          if grep -Fq '<!-- dailyflow-installation-guide -->' <<<"$existing_body"; then
            echo "Installation guidance is already present."
            exit 0
          fi

          {
            printf '%s\n\n' "$existing_body"
            sed "s/{{RELEASE_TAG}}/${RELEASE_TAG}/g" .github/release-installation.md
          } > "$RUNNER_TEMP/release-notes.md"

          gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
