[package]
name = "dailyflow"
version = "1.4.1"
description = "DailyFlow - Daily notes and task management"
authors = ["DailyFlow"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77"

[lib]
name = "dailyflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dailyflow"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
